[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[providers.file]
  filename = "fixtures/ocsp/simple_1659989673.toml"

[ocsp.responderOverrides]
  ocsp.example.com = "http://127.0.0.1:57089"

[log]
  level="debug"

## dynamic configuration ##

[[tls.certificates]]
  certFile = "fixtures/ocsp/server.crt"
  keyFile = "fixtures/ocsp/server.key"

[tls.stores]
  [tls.stores.default.defaultCertificate]
    certFile = "fixtures/ocsp/default.crt"
    keyFile = "fixtures/ocsp/default.key"
