# Base demo stack: a correctly wired Traefik + whoami.
# Run from mcp/demo via ./demo.sh; scenario overlays in scenarios/*/compose.yml
# add the broken/insecure bits each demo needs.
services:
  traefik:
    image: traefik:v3.7
    ports:
      - "8081:80"
      - "443:443"
      - "8088:8080" # API / dashboard (api.insecure) on host :8088
    volumes:
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/dynamic:/etc/traefik/dynamic:ro
      - ./plugins/slowdown:/plugins-local/src/github.com/traefik/traefik-mcp/plugins/slowdown:ro
      - ./logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - lgtm

  # otel-lgtm: Grafana's all-in-one Loki/Grafana/Tempo/Mimir image. Traefik
  # ships OTLP traces to it (gRPC :4317); Tempo's query API is on :3200, which
  # the MCP server reads via --tempo.url.
  lgtm:
    image: grafana/otel-lgtm:0.11.16
    ports:
      - "3000:3000" # Grafana UI
      - "3200:3200" # Tempo query API (read by traefik-mcp)

  whoami:
    image: traefik/whoami
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.localhost`)
      - traefik.http.routers.whoami.entrypoints=web
