# Scenario 02 — security posture: audit, harden, validate.
# Two findings to surface from the live runtime, then fix with the reference:
#   - admin: a sensitive-looking service exposed on the plain HTTP entrypoint,
#            no TLS, no auth middleware (public-no-TLS finding from /api/rawdata).
#   - a short-lived TLS certificate mounted via the file provider, whose expiry
#            is exposed only as the Prometheus metric traefik_tls_certs_not_after
#            (run scripts/gen-certs.sh first).
services:
  traefik:
    volumes:
      # tls.yml is copied into config/dynamic by demo.sh (it can't be bind-mounted
      # into the read-only dynamic dir); certs is a fresh mount path.
      - ./certs:/certs:ro

  admin:
    image: traefik/whoami
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=Host(`admin.localhost`)
      - traefik.http.routers.admin.entrypoints=web
