# Loads the short-lived demo certificate (generated by scripts/gen-certs.sh) via
# the file provider. Once loaded, Traefik exposes its expiry as the Prometheus
# metric traefik_tls_certs_not_after, which is how the audit step finds it.
tls:
  certificates:
    - certFile: /certs/demo.crt
      keyFile: /certs/demo.key
