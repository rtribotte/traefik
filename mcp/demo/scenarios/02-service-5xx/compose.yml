# Scenario 02 — 5xx from a misconfigured backend.
# billing runs fine, its router and service exist, but the service is told to
# reach the container on port 9999 while whoami listens on 80. Traefik can't
# connect to the backend, so it returns 502 Bad Gateway. The route never
# disappears (unlike stopping the container, which would 404), so the question
# is genuinely "is this Traefik or my service?" — and the answer is the service
# config (wrong port), not Traefik.
services:
  billing:
    image: traefik/whoami
    labels:
      - traefik.enable=true
      - traefik.http.routers.billing.rule=Host(`billing.localhost`)
      - traefik.http.routers.billing.entrypoints=web
      - traefik.http.services.billing.loadbalancer.server.port=9999
