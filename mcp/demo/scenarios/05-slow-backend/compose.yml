# Scenario 05 — a slow backend application.
# catalog runs fine: its router and service exist, the backend is UP, and every
# request returns 200. Nothing is wrong in Traefik or the service config. The
# application itself is just slow to respond. The only place this shows up is the
# access log's request duration — so it can only be diagnosed by reading logs,
# not by inspecting routers, services or health.
#
# whoami has no "always slow" mode; it delays a response when asked with the
# ?wait query parameter. Generate slow traffic with it (see the README) and the
# access log records the high duration.
services:
  catalog:
    image: traefik/whoami
    labels:
      - traefik.enable=true
      - traefik.http.routers.catalog.rule=Host(`catalog.localhost`)
      - traefik.http.routers.catalog.entrypoints=web
