# Two routers match Host(`shop.localhost`), both valid and enabled:
#   - shop is the intended one, with no explicit priority, so Traefik derives it
#     from the rule length (~22).
#   - shop-maintenance is a leftover (someone pointed shop.localhost at a
#     maintenance page during an outage and bumped its priority) carrying an
#     explicit priority of 1000.
# Because a higher priority wins, shop-maintenance outranks shop and
# shop.localhost is served the maintenance backend. Neither router errors; the
# only evidence is the priority gap, which is why the fix needs the reference
# (how v3 priority works) rather than just reading a status. The rule is scoped
# to shop.localhost so it shadows only that host, not the whole entrypoint.
http:
  routers:
    shop:
      rule: "Host(`shop.localhost`)"
      entrypoints:
        - web
      service: shop
    shop-maintenance:
      rule: "Host(`shop.localhost`)"
      priority: 1000
      entrypoints:
        - web
      service: maintenance
  services:
    shop:
      loadBalancer:
        servers:
          - url: "http://whoami:80"
    maintenance:
      loadBalancer:
        servers:
          - url: "http://maintenance:80"
