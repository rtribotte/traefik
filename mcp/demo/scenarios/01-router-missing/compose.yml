# Scenario 01 — router missing / not applied.
# Two distinct, common failure modes:
#   - api:  references a middleware that does not exist -> router in "warning"
#           with an error (visible in list_routers errors).
#   - typo: the rule label key is misspelled (rulee) -> router is never created
#           at all (silently absent from the API).
services:
  api:
    image: traefik/whoami
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.localhost`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.routers.api.middlewares=does-not-exist@docker

  typo:
    image: traefik/whoami
    labels:
      - traefik.enable=true
      # Misspelled "rule" key: Traefik ignores it, router is never created.
      - traefik.http.routers.typo.rulee=Host(`typo.localhost`)
      - traefik.http.routers.typo.entrypoints=web
