# Static (install) configuration for the demo Traefik.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  insecure: true # exposes the API/dashboard on :8080 for the MCP server.
  dashboard: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

log:
  # DEBUG so Traefik dumps its redacted static configuration as JSON at startup
  # ("Static configuration loaded [json]"); the MCP server reads that line to
  # deduce which tools to expose.
  level: DEBUG
  # File app log so tail_traefik_logs has a target to read.
  filePath: "/logs/traefik.log"
  format: json

# File access log so tail_access_logs has a target to read.
accessLog:
  filePath: "/logs/access.log"
  format: json

# Prometheus pull endpoint so the metrics-backed tools work.
metrics:
  prometheus: {}

# Ship traces over OTLP/gRPC to otel-lgtm's Tempo, which the trace tools read.
tracing:
  otlp:
    grpc:
      endpoint: lgtm:4317
      insecure: true

# Local (Yaegi) plugin used by the trace-latency scenario. Declared here so it
# is installed in the instance; it only affects routes that reference it.
experimental:
  localPlugins:
    randomplugin:
      moduleName: github.com/traefik/traefik-mcp/plugins/randomplugin

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true
