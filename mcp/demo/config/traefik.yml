# Static (install) configuration for the demo Traefik.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  insecure: true # exposes the API/dashboard on :8080 for the MCP server.
  dashboard: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

log:
  # DEBUG so Traefik dumps its redacted static configuration as JSON at startup
  # ("Static configuration loaded [json]"); the MCP server reads that line to
  # deduce which tools to expose.
  level: DEBUG
  # File app log so tail_traefik_logs has a target to read.
  filePath: "/logs/traefik.log"
  format: json

# Access log to BOTH a file (tail_access_logs) and OTLP/gRPC → otel-lgtm's Loki
# (query_access_logs). dualOutput keeps the file output, which OTLP disables by
# default. OTLP access logging requires the experimental.otlpLogs flag below.
accessLog:
  filePath: "/logs/access.log"
  format: json
  otlp:
    grpc:
      endpoint: lgtm:4317
      insecure: true
  dualOutput: true

# Metrics to BOTH a Prometheus pull endpoint (get_metrics) and OTLP/gRPC →
# otel-lgtm's Prometheus (query_metrics).
metrics:
  prometheus: {}
  otlp:
    grpc:
      endpoint: lgtm:4317
      insecure: true

# Ship traces over OTLP/gRPC to otel-lgtm's Tempo, which the trace tools read.
tracing:
  otlp:
    grpc:
      endpoint: lgtm:4317
      insecure: true

# otlpLogs: required to ship access logs over OTLP (see accessLog.otlp above).
# localPlugins: the trace-latency scenario's Yaegi plugin, installed here so it
# is available; it only affects routes that reference it.
experimental:
  otlpLogs: true
  localPlugins:
    pluginA:
      moduleName: github.com/traefik/traefik-mcp/plugins/pluginA

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true
